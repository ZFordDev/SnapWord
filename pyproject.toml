[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "snapword"
version = "0.1.0"
description = "SnapWord - local-first word processor in the Snap Ocean Suite"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"

authors = [
  { name = "ZFordDev", email = "zforddev@gmail.com" }
]
maintainers = [
  { name = "ZFordDev", email = "zforddev@gmail.com" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

dependencies = [
    "PySide6",
  "python-docx",
  "odfpy",
  "markdown",
  "striprtf",
]

[project.optional-dependencies]
dev = ["pytest", "black", "ruff"]
build = ["pyinstaller", "pillow"]

[tool.setuptools.packages.find]
include = ["snapword*"]

[tool.setuptools.package-data]
"snapword.themes" = ["*.qss", "*.qss.in"]
"snapword" = ["assets/*.svg", "assets/*.png", "assets/*.ico", "assets/*.icns"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "SIM", "BLE"]
# N802: PySide6 requires camelCase override names (insertFromMimeData, keyPressEvent).
# BLE001: UI file/rendering code intentionally surfaces errors instead of crashing.
ignore = ["N802", "BLE001"]

[project.scripts]
snapword = "snapword.main:main"
